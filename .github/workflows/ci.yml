name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  viewer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore viewer
        run: dotnet restore src/U3DViewer.Viewer/U3DViewer.Viewer.csproj
      - name: Build viewer and protocol
        run: dotnet build src/U3DViewer.Viewer/U3DViewer.Viewer.csproj -c Release --no-restore

  agent-note:
    runs-on: windows-latest
    steps:
      - name: Explain agent build boundary
        shell: pwsh
        run: |
          Write-Host 'U3DViewer.Agent.Mono is intentionally not built in CI.'
          Write-Host 'It requires UnityEngine assemblies copied from an authorized target game into src/U3DViewer.Agent.Mono/lib/.'
